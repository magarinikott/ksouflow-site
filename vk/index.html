<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <title>Авторизация ВКонтакте — KSOU FLOW</title>
    <meta name="description" content="Страница завершения авторизации ВКонтакте для KSOU FLOW." />
    <meta name="theme-color" content="#140919" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css?v=20260929-2" />
    <style>
      .vk-page {
        min-height: calc(100svh - 116px);
        display: grid;
        align-content: center;
        padding-top: 48px;
      }

      .vk-page h1 {
        max-width: 760px;
        font-size: clamp(3rem, 7vw, 5.8rem);
      }

      .vk-intro {
        max-width: 620px;
        margin: 22px 0 0;
      }

      .vk-card {
        margin-top: 34px;
        padding: 30px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(31, 14, 37, 0.72);
      }

      .vk-list {
        display: grid;
        gap: 14px;
      }

      .vk-field {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: end;
      }

      .vk-field label {
        display: grid;
        min-width: 0;
        gap: 8px;
      }

      .vk-name {
        color: var(--gold);
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .vk-value {
        width: 100%;
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        outline: none;
        background: rgba(14, 6, 18, 0.72);
        color: var(--text);
        font: 500 0.86rem/1.4 var(--sans);
        text-overflow: ellipsis;
      }

      .vk-value:focus {
        border-color: rgba(232, 199, 132, 0.45);
      }

      .copy-button {
        min-width: 124px;
        min-height: 48px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font: 700 0.74rem/1 var(--sans);
        transition: border-color 180ms ease, color 180ms ease, transform 180ms ease;
      }

      .copy-button:hover {
        border-color: rgba(232, 199, 132, 0.42);
        color: var(--gold);
        transform: translateY(-1px);
      }

      .copy-button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }

      .copy-button[data-copied="true"] {
        border-color: rgba(232, 199, 132, 0.5);
        background: rgba(232, 199, 132, 0.1);
        color: var(--gold);
      }

      .vk-status {
        min-height: 1.5em;
        margin: 18px 0 0;
        color: var(--text-muted);
        font-size: 0.72rem;
      }

      .vk-empty {
        margin: 0;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 640px) {
        .vk-page {
          min-height: calc(100svh - 92px);
          align-content: start;
          padding-top: 56px;
        }

        .vk-card {
          padding: 22px;
        }

        .vk-field {
          grid-template-columns: 1fr;
        }

        .copy-button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="legal-shell">
      <header class="topbar legal-topbar">
        <a class="brand" href="../" aria-label="KSOU FLOW — на главную">KSOU FLOW</a>
        <nav class="legal-nav" aria-label="Навигация">
          <a href="../support.html">поддержка</a>
        </nav>
      </header>

      <main class="legal-page vk-page">
        <div>
          <p class="eyebrow">ВКонтакте · OAuth</p>
          <h1 id="page-title">Страница авторизации ВКонтакте</h1>
          <p class="vk-intro" id="page-intro">
            Здесь появятся параметры после возвращения из ВКонтакте.
          </p>

          <section class="vk-card" id="result-card">
            <p class="vk-empty" id="empty-state">Страница авторизации ВКонтакте</p>
            <div class="vk-list" id="parameter-list" hidden></div>
            <p class="vk-status" id="copy-status" aria-live="polite"></p>
          </section>
        </div>
      </main>
    </div>

    <script>
      (function () {
        "use strict";

        var title = document.getElementById("page-title");
        var intro = document.getElementById("page-intro");
        var list = document.getElementById("parameter-list");
        var empty = document.getElementById("empty-state");
        var status = document.getElementById("copy-status");
        var entries = [];

        function appendParameters(raw) {
          if (!raw) return;
          var normalized = raw.replace(/^[?#]/, "");
          if (!normalized) return;
          new URLSearchParams(normalized).forEach(function (value, key) {
            entries.push([key, value]);
          });
        }

        appendParameters(window.location.search);
        appendParameters(window.location.hash);

        function copyValue(input, button, name) {
          function confirmCopy() {
            button.textContent = "Скопировано";
            button.dataset.copied = "true";
            status.textContent = "Параметр «" + name + "» скопирован.";
            window.setTimeout(function () {
              button.textContent = "Скопировать";
              button.dataset.copied = "false";
            }, 1800);
          }

          function fallbackCopy() {
            input.focus();
            input.select();
            input.setSelectionRange(0, input.value.length);
            try {
              document.execCommand("copy");
              confirmCopy();
            } catch (error) {
              status.textContent = "Не удалось скопировать автоматически. Выделите значение вручную.";
            }
          }

          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(input.value).then(confirmCopy, fallbackCopy);
          } else {
            fallbackCopy();
          }
        }

        if (entries.length > 0) {
          title.textContent = "Авторизация прошла";
          intro.textContent = "Скопируйте код и вернитесь в приложение.";
          empty.hidden = true;
          list.hidden = false;

          entries.forEach(function (entry, index) {
            var name = entry[0] || "parameter";
            var value = entry[1];
            var row = document.createElement("div");
            var label = document.createElement("label");
            var caption = document.createElement("span");
            var input = document.createElement("input");
            var button = document.createElement("button");
            var inputId = "vk-param-" + index;

            row.className = "vk-field";
            caption.className = "vk-name";
            caption.textContent = name;
            input.className = "vk-value";
            input.id = inputId;
            input.type = "text";
            input.value = value;
            input.readOnly = true;
            input.autocomplete = "off";
            input.spellcheck = false;
            input.setAttribute("aria-label", "Значение параметра " + name);
            button.className = "copy-button";
            button.type = "button";
            button.textContent = "Скопировать";
            button.dataset.copied = "false";
            button.setAttribute("aria-controls", inputId);
            button.addEventListener("click", function () {
              copyValue(input, button, name);
            });

            label.htmlFor = inputId;
            label.appendChild(caption);
            label.appendChild(input);
            row.appendChild(label);
            row.appendChild(button);
            list.appendChild(row);
          });
        }
      })();
    </script>
  </body>
</html>
