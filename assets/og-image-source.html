<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { position: relative; color: #f5e9de; background: radial-gradient(circle at 83% 10%, rgba(113,54,76,.28), transparent 37%), #19070f; font-family: Manrope, system-ui, sans-serif; }
    .frame { position: absolute; inset: 60px; border: 1px solid #71364c; border-radius: 34px; }
    .brand { position: absolute; top: 120px; left: 124px; margin: 0; font: 600 25px/1 'Cormorant Garamond', Georgia, serif; letter-spacing: .14em; }
    .star { position: absolute; top: 108px; right: 130px; color: #e6b65b; font: 52px/1 Georgia, serif; }
    .eyebrow { position: absolute; top: 221px; left: 124px; margin: 0; color: #e6b65b; font: 700 14px/1 Manrope, system-ui, sans-serif; letter-spacing: .1em; }
    h1 { position: absolute; top: 272px; left: 122px; margin: 0; font: 500 79px/.96 'Cormorant Garamond', Georgia, serif; letter-spacing: -.035em; }
    .detail { position: absolute; bottom: 119px; left: 124px; margin: 0; color: #c5a6bf; font: 500 16px/1.5 Manrope, system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="frame"></div>
  <p class="brand">KSOU FLOW</p>
  <div class="star" aria-hidden="true">✦</div>
  <p class="eyebrow">ИНТУИТИВНАЯ ЯСНОСТЬ · БЕРЕЖНЫЙ ВЗГЛЯД</p>
  <h1>услышьте то,<br>что уже знаете внутри</h1>
  <p class="detail">развлекательное приложение с символическими раскладами Ленорман</p>
</body>
</html>
