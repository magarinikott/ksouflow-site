    <meta name="referrer" content="no-referrer" />

    <title>Код авторизации — KSOU FLOW</title>
    <style>:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #19070f;
  color: #f5e9de;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
  margin: 0;
}

body {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(circle at 50% 18%, rgba(113, 54, 76, 0.24), transparent 34rem),
    #19070f;
}

main {
  width: min(100%, 520px);
}

.brand {
  margin: 0 0 44px;
  color: #e6b65b;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.eyebrow {
  margin: 0 0 12px;
  color: #e6b65b;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(36px, 9vw, 58px);
  font-weight: 500;
  line-height: 0.98;
  letter-spacing: -0.035em;
}

.description {
  max-width: 42ch;
  margin: 20px 0 32px;
  color: #c5a6bf;
  font-size: 16px;
  line-height: 1.6;
}

.code-shell {
  display: flex;
  align-items: center;
  min-height: 64px;
  padding: 0 20px;
  overflow: hidden;
  border: 1px solid rgba(113, 54, 76, 0.56);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.045);
}

.code-value {
  width: 100%;
  overflow: hidden;
  color: #f5e9de;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 15px;
  letter-spacing: 0.04em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

button {
  width: 100%;
  min-height: 56px;
  margin-top: 14px;
  border: 0;
  border-radius: 16px;
  color: #290a17;
  background: linear-gradient(135deg, #e8cdaa, #f3e3cb);
  font: inherit;
  font-weight: 800;
  cursor: pointer;
  transition: transform 140ms ease, filter 140ms ease, opacity 140ms ease;
}

button:hover:not(:disabled) {
  filter: brightness(1.06);
}

button:active:not(:disabled) {
  transform: translateY(1px) scale(0.995);
}

button:focus-visible {
  outline: 3px solid rgba(243, 227, 203, 0.9);
  outline-offset: 3px;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.42;
}

.status {
  min-height: 24px;
  margin: 14px 0 0;
  color: #c5a6bf;
  font-size: 14px;
  line-height: 1.5;
}

.status[data-kind="success"] {
  color: #d7f4d2;
}

.status[data-kind="error"] {
  color: #ffb9c2;
}

.security-note {
  margin: 42px 0 0;
  padding-top: 18px;
  border-top: 1px solid rgba(113, 54, 76, 0.56);
  color: #a8849d;
  font-size: 13px;
  line-height: 1.6;
}

[hidden] {
  display: none !important;
}

@media (max-width: 520px) {
  body {
    place-items: start center;
    padding: 28px 20px;
  }

  .brand {
    margin-bottom: 72px;
  }
}

@media (prefers-reduced-motion: reduce) {
  button {
    transition: none;
  }
}
</style>

  <body>
    <main aria-labelledby="page-title">
      <p class="brand">KSOU FLOW</p>
      <p class="eyebrow">Meta API</p>
      <h1 id="page-title">Код авторизации</h1>
      <p class="description">
        Авторизация завершена. Скопируйте одноразовый код и вернитесь в окно настройки интеграции.
      </p>

      <div class="code-shell" aria-label="Полученный код авторизации">
        <span class="code-value" id="code-value">Проверяем ответ Meta…</span>
      </div>
      <button id="copy-button" type="button" disabled>Скопировать код</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>

      <p class="security-note">
        Код не сохраняется на этой странице и не отправляется сторонним сервисам. Не передавайте его другим людям.
      </p>
    </main>
    <script>(() => {
  "use strict";

  const params = new URLSearchParams(window.location.search);
  const rawCode = params.get("code");
  const oauthError = params.get("error");
  const oauthErrorDescription = params.get("error_description");

  window.history.replaceState(null, document.title, window.location.pathname);

  const code = rawCode && rawCode.length <= 4096 ? rawCode : "";
  const codeValue = document.getElementById("code-value");
  const copyButton = document.getElementById("copy-button");
  const status = document.getElementById("status");

  const setStatus = (message, kind) => {
    status.textContent = message;
    status.dataset.kind = kind;
  };

  const maskCode = (value) => {
    if (value.length <= 10) return "••••••••••";
    return `${value.slice(0, 6)}${"•".repeat(10)}${value.slice(-4)}`;
  };

  const fallbackCopy = (value) => {
    const field = document.createElement("textarea");
    field.value = value;
    field.setAttribute("readonly", "");
    field.style.position = "fixed";
    field.style.opacity = "0";
    field.style.pointerEvents = "none";
    document.body.appendChild(field);
    field.select();
    const copied = document.execCommand("copy");
    field.remove();
    if (!copied) throw new Error("copy-failed");
  };

  if (oauthError) {
    const safeDescription = oauthErrorDescription
      ? oauthErrorDescription.slice(0, 240)
      : "Meta не вернула код авторизации.";
    codeValue.textContent = "Код не получен";
    copyButton.disabled = true;
    setStatus(`Авторизация отменена: ${safeDescription}`, "error");
    return;
  }

  if (!code) {
    codeValue.textContent = "Код не найден";
    copyButton.disabled = true;
    setStatus("Откройте эту страницу через окно авторизации Meta.", "error");
    return;
  }

  codeValue.textContent = maskCode(code);
  copyButton.disabled = false;
  setStatus("Одноразовый код получен и скрыт.", "success");

  copyButton.addEventListener("click", async () => {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(code);
      } else {
        fallbackCopy(code);
      }
      copyButton.textContent = "Код скопирован";
      setStatus("Вставьте код только в доверенное окно настройки интеграции.", "success");
    } catch {
      copyButton.textContent = "Не удалось скопировать";
      setStatus("Браузер запретил доступ к буферу обмена. Повторите попытку.", "error");
    }
  });
})();
</script>
  </body>
</html>
